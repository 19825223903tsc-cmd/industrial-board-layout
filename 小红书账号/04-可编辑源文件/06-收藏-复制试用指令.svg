<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect x="0" y="0" width="1200" height="1600" fill="#181919"/><text x="68" y="77" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#FFFFFF">工业设计 / 构图 Skill</text><text x="780" y="77" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#FFFFFF">SAVE &amp; TRY</text><line x1="68" y1="107" x2="1132" y2="107" stroke="#484949" stroke-width="1"/><text x="68" y="154" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#E3482D">FIELD NOTES — 06</text><text x="68" y="287" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="90" font-weight="600" fill="#FFFFFF">保存这段，</text><text x="68" y="397" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="90" font-weight="600" fill="#FFFFFF">下次做展板用。</text><text x="68" y="472" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#B8B8B0">安装后上传产品图，按目标语言选一个：</text><rect x="68" y="536" width="1064" height="660" fill="#242626"/><rect x="68" y="536" width="7" height="660" fill="#E3482D"/><text x="105" y="610" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="29" font-weight="600" fill="#FFFFFF">中文：$industrial-board-layout-zh</text><text x="105" y="678" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">英文：$industrial-board-layout-en</text><text x="105" y="746" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">用我上传的产品图，规划 A3 竖版展板。</text><text x="105" y="814" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">重点展示形态、细节与使用关系。</text><text x="105" y="882" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">缺少依据就精简模块，不补造产品结构。</text><text x="105" y="950" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">先完成五轮检查，再输出构图线框、</text><text x="105" y="1018" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">取景说明和生图提示词。</text><text x="105" y="1086" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#FFFFFF">暂不生成最终展板。</text><text x="68" y="1281" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#FFFFFF">想少些盲目抽卡，先把构图说清楚。</text><text x="68" y="1350" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="29" font-weight="400" fill="#B8B8B0">这个 Skill 辅助生图模型构图。</text><text x="68" y="1403" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#B8B8B0">实际生成后，继续核对产品细节、文字和间距。</text><line x1="68" y1="1494" x2="1132" y2="1494" stroke="#484949" stroke-width="1"/><text x="68" y="1537" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#B8B8B0">工业设计展板构图 Skill / 中文版与英文版独立安装</text><text x="1080" y="1537" font-family="Hiragino Sans GB, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#B8B8B0">06</text></svg>